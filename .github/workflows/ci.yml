name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy pytest pytest-asyncio

      - name: Lint with ruff
        run: ruff check .

      - name: Type check with mypy
        run: mypy gas_finder.py gas_finder_history.py app.py --ignore-missing-imports

      - name: Run tests
        run: pytest test_gas_finder.py -v

  build-docker:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: gas-finder:test
          load: true

      - name: Test Docker image
        run: |
          docker run -d --name test-container -p 5002:5002 gas-finder:test
          sleep 10
          curl -f http://localhost:5002/api/sources
          curl -X POST http://localhost:5002/api/search \
            -H "Content-Type: application/json" \
            -d '{"location": "90210", "radius": 10, "fuel_types": ["regular"]}'
          docker stop test-container
          docker rm test-container