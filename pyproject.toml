[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F"]
ignore = [
    "BLE001",
]

[tool.ruff.lint.isort]
known-first-party = ["gas_finder", "gas_finder_cache", "gas_finder_history"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
disallow_untyped_defs = false
